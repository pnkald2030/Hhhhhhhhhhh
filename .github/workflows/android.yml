name: Build Kimo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KimoAndroid_updated_source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Kimo APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          test -f KimoAndroid_updated_source.zip
          mkdir -p extracted
          unzip -q KimoAndroid_updated_source.zip -d extracted
          test -f extracted/KimoAndroid/settings.gradle
          test -f extracted/KimoAndroid/app/build.gradle

      - name: Align Java and Kotlin JVM targets
        working-directory: extracted/KimoAndroid
        shell: bash
        run: |
          cat >> app/build.gradle <<'GRADLE'

          // Set Android Java bytecode compatibility to match Kotlin JVM 17.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE

      - name: Build debug APK
        working-directory: extracted/KimoAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kimo-debug-apk
          path: extracted/KimoAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
