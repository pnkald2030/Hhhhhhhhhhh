name: Build Kimo Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'KimoAndroid_updated_source.zip'
      - 'repair_kimo.py'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    name: Compile Kimo Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          test -s KimoAndroid_updated_source.zip
          unzip -q KimoAndroid_updated_source.zip -d extracted
          test -f extracted/KimoAndroid/settings.gradle
          test -f extracted/KimoAndroid/app/build.gradle
      - name: Apply Android source repairs
        working-directory: extracted/KimoAndroid
        run: python3 ../../repair_kimo.py
      - name: Build debug APK
        working-directory: extracted/KimoAndroid
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kimo-android-apk
          path: extracted/KimoAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
