name: Build Kimo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KimoAndroid_updated_source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Kimo APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          test -f KimoAndroid_updated_source.zip
          mkdir -p extracted
          unzip -q KimoAndroid_updated_source.zip -d extracted
          test -f extracted/KimoAndroid/settings.gradle
          test -f extracted/KimoAndroid/app/build.gradle

      - name: Align Java and Kotlin JVM targets
        working-directory: extracted/KimoAndroid
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text()
          # Kotlin is already targeting JVM 17; align Java compileOptions with it.
          s2 = re.sub(r'JavaVersion\\.VERSION_1_8', 'JavaVersion.VERSION_17', s)
          if s2 == s and 'sourceCompatibility' in s:
              s2 = re.sub(r'(sourceCompatibility\\s*(?:=)?\\s*)JavaVersion\\.VERSION_\\w+', r'\\1JavaVersion.VERSION_17', s2)
              s2 = re.sub(r'(targetCompatibility\\s*(?:=)?\\s*)JavaVersion\\.VERSION_\\w+', r'\\1JavaVersion.VERSION_17', s2)
          p.write_text(s2)
          print('Aligned Java compileOptions to JVM 17')
          PY

      - name: Build debug APK
        working-directory: extracted/KimoAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kimo-debug-apk
          path: extracted/KimoAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
