<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>كيمو - دليل اليمن التجاري</title>
    <!-- استدعاء خط عربي فني متناسق مع مظهر الصورة -->
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة PapaParse لقراءة ملفات CSV بسهولة من Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --primary-color: #0b8457;
            --primary-light: #12a26d;
            --secondary-color: #1a2e40;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --star-color: #fbbc04; /* لون نجمات خرائط جوجل الأصفر المميز */
            --danger-color: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 100vw;
            background-color: #f8fafc;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        @media (min-width: 481px) {
            .app-container {
                max-width: 450px;
                box-shadow: 0 0 25px rgba(0,0,0,0.1);
            }
        }

        /* الهيدر العلوي */
        header {
            background: #fff;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .header-top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-icon {
            font-size: 14px;
            color: var(--secondary-color);
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f1f5f9;
            position: relative;
            transition: background 0.2s;
        }

        .header-icon.logged-in {
            background: #e6f4ed;
            color: var(--primary-color);
            border: 1px solid #b7e3cf;
        }

        .notification-badge {
            position: absolute;
            top: 1px;
            right: 1px;
            background: var(--danger-color);
            color: white;
            font-size: 7.5px;
            font-weight: bold;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* تصميم اسم "كيمو" برمجياً */
        .logo-center-box {
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .kemo-logo-mark {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 5px;
            line-height: 1;
        }
        .kemo-logo-pin {
            color: var(--primary-color);
            font-size: 25px;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,.12));
        }
        .kemo-artistic-name {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 27px;
            font-weight: 900;
            color: var(--secondary-color);
            letter-spacing: -1px;
            line-height: 1.1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.08);
            position: relative;
        }
        .logo-center-box > span {
            font-size: 8.5px;
            color: var(--text-muted);
            font-weight: 700;
            margin-top: 1px;
        }

        /* البانر الأخضر */
        .hero-banner {
            background: linear-gradient(135deg, #0b8457 0%, #065e3d 100%);
            color: white;
            padding: 12px 14px;
            border-radius: 0 0 16px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .hero-title { font-size: 13.5px; font-weight: 800; line-height: 1.2; }
        .hero-subtitle { font-size: 9.5px; opacity: 0.9; margin-top: 2px; }

        .add-business-btn {
            background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            color: #0f172a;
            border: none;
            padding: 7px 10px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 8px rgba(251, 133, 0, 0.35);
            white-space: nowrap;
        }

        /* البحث والفلاتر */
        .search-section { padding: 0 10px 8px 10px; }
        .search-card {
            background: white;
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            padding: 2px 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            gap: 6px;
        }

        .search-input {
            border: none;
            outline: none;
            width: 100%;
            padding: 6px;
            font-size: 11px;
            color: var(--text-main);
            background: transparent;
            text-align: right;
        }

        .search-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .filters-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .near-me-btn {
            flex: 1;
            background: #e6f4ed;
            color: var(--primary-color);
            border: 1px solid #b7e3cf;
            padding: 6px 4px;
            border-radius: 8px;
            font-size: 9.5px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            white-space: nowrap;
        }

        .select-box {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 3px;
            font-size: 9.5px;
            color: var(--text-main);
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            cursor: pointer;
            text-overflow: ellipsis;
        }

        /* كبسولات الأقسام وأيقونات دائرية */
        .categories-scroll-wrapper { padding: 4px 6px 8px 6px; width: 100%; box-sizing: border-box; }
        .categories-row {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 4px;
            width: 100%;
            overflow: hidden;
            padding: 0 0 6px;
            box-sizing: border-box;
        }
        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 4px;
            cursor: pointer;
            min-width: 0;
            width: 100%;
        }

        .category-label { 
            font-size: clamp(8px, 2.4vw, 10px);
            font-weight: 700;
            color: var(--secondary-color);
            background: #ffffff;
            padding: 3px 1px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            white-space: normal;
            line-height: 1.2;
            min-height: 24px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        
        .category-item:hover .category-label, .category-item.active .category-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .category-icon {
            width: clamp(25px, 7.5vw, 32px);
            height: clamp(25px, 7.5vw, 32px);
            flex: 0 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
